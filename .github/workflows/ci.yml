name: kernel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format and core tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p kernel-core
          python3 -m py_compile tools/x128.py scripts/run.py
      - name: x128 reference boot
        run: |
          bash scripts/x128.sh smoke
          bash scripts/x128.sh build
      - name: Recontrol compiler
        uses: actions/checkout@v4
        with:
          repository: plash3r/recontrol-lang
          ref: 60afe21fbae870cf9b6ec36d4bdfd798a738d84f
          path: .deps/recontrol-lang
      - name: Recontrol kernel ABI
        run: |
          cargo build --locked --manifest-path .deps/recontrol-lang/Cargo.toml -p rcl
          RCL="$PWD/.deps/recontrol-lang/target/debug/rcl" bash scripts/recontrol.sh
          git diff --exit-code -- userspace/recontrol/kernel_probe.ll
      - name: Emulator and LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang qemu-system-x86 ovmf
      - name: Boot smoke test
        run: |
          bash scripts/build.sh smoke
          python3 scripts/run.py --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-evidence
          path: |
            build/smoke.log
            build/generic-smoke-uefi.img
            build/generic-x128.img
